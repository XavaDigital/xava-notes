name = "xava-notes-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Run the scheduled handler every minute (send due reminders + flush the outbox).
[triggers]
crons = ["* * * * *"]

# D1 database binding. Create it with:
#   wrangler d1 create xava-notes
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "xava-notes"
database_id = "954041d1-e88d-4180-90ac-93c3674158c7"

[vars]
# The OAuth *Web application* client id from your dedicated Google Cloud project
# (drive.file scope, published to Production). The same client id the PWA uses.
GOOGLE_CLIENT_ID = "273765857524-837m333nlq58hl8ccmksnpir2ghjhs4d.apps.googleusercontent.com"
# Your GitHub Pages origin (no path, no trailing slash) — used for CORS.
ALLOWED_ORIGIN = "https://xavadigital.github.io"
# VAPID public key (it is public, so a var is fine). Generate with:
#   npx web-push generate-vapid-keys
VAPID_PUBLIC_KEY = "BGgxjagp7vma_OF7MtiyVdAbFjTDGGxB5KdT8c_L5fwLlBvV6Jw_XMh1SRZGwVSAK92UirO6CB7saP4jx6jL2XI"
# Contact for push services (mailto: or https:).
VAPID_SUBJECT = "mailto:david@xavadigital.com"

# Mailgun — powers the "Email me a copy when I save this" toggle.
# MAILGUN_DOMAIN must be a verified sending domain in your Mailgun account.
MAILGUN_DOMAIN = "mg.xavadigital.com"
# Where the emails go.
NOTIFY_EMAIL = "david@xavadigital.com"
# Optional: From override (defaults to notes@<MAILGUN_DOMAIN>), and the EU API
# base if your Mailgun account is in the EU region.
# MAILGUN_FROM = "Xava Notes <notes@mg.xavadigital.com>"
# MAILGUN_BASE_URL = "https://api.eu.mailgun.net"

# Secrets — set with `wrangler secret put <NAME>` (NOT committed):
#   GOOGLE_CLIENT_SECRET   (from the OAuth Web client)
#   VAPID_PRIVATE_KEY      (from web-push generate-vapid-keys)
#   MAILGUN_API_KEY        (your Mailgun private API key)
